bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: odom
    robot_base_frame: base_footprint
    # Pose and velocity from the same source: visual SLAM's odometry, frame
    # ids odom -> base_footprint. The Steering controller's own open-loop
    # odometry stays on its private topic and its TF stays disabled.
    odom_topic: /visual_slam/tracking/odometry
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    transform_tolerance: 1.0
    enable_stamped_cmd_vel: false
    odom_topic: /visual_slam/tracking/odometry   # same source as bt_navigator
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 15.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # Arrival: within one car length (chassis_length in the xacro), heading
      # ignored. test_vehicle_geometry.py asserts the number.
      xy_goal_tolerance: 0.44
      yaw_goal_tolerance: 6.3
      latch_xy_goal_tolerance: True
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.0
      max_angular_vel: 1.0
      max_angular_accel: 2.0
      max_angular_decel: 2.0
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      use_rotate_to_heading: false
      allow_reversing: false

      short_circuit_trajectory_evaluation: True
      stateful: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom            # ADR-0001
      robot_base_frame: base_footprint
      use_sim_time: False
      transform_tolerance: 1.0
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Chassis box (0.44 x 0.27 in the xacro) plus 2 cm all round, centred on
      # base_footprint. test_vehicle_geometry.py asserts it.
      footprint: "[ [0.24, 0.155], [0.24, -0.155], [-0.24, -0.155], [-0.24, 0.155] ]"
      # Obstacle source: nvblox's 2D occupancy grid, sliced from the band set in
      # perception.launch.py, plus inflation. No scan or voxel layer: the car
      # has no lidar, and a layer waiting on one only logs warnings.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: False   # nvblox publishes volatile
        map_topic: "/nvblox_node/static_occupancy_grid"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: odom            # ADR-0001
      robot_base_frame: base_footprint
      use_sim_time: False
      transform_tolerance: 1.0
      rolling_window: true
      width: 10
      height: 10
      footprint: "[ [0.24, 0.155], [0.24, -0.155], [-0.24, -0.155], [-0.24, 0.155] ]"
      resolution: 0.05
      # Unknown cells stay unknown (not free) so the planner can cross them at
      # a cost (allow_unknown) instead of treating unseen ground as clear.
      track_unknown_space: true
      # Obstacle source: nvblox's 2D occupancy grid, sliced from the band set in
      # perception.launch.py, plus inflation. No scan or voxel layer: the car
      # has no lidar, and a layer waiting on one only logs warnings.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: False   # nvblox publishes volatile
        map_topic: "/nvblox_node/static_occupancy_grid"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: False
    transform_tolerance: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      # Derivation: R_min = wheelbase / tan(steering lock), wheelbase 0.29 m and
      # lock 0.575 rad from description/description.urdf.xacro. The lock comes
      # from a measured turning circle (2026-09-12): inside diameter 25 in at
      # the inner rear tyre, so the rear-axle midpoint turns at 0.45 m. This
      # parameter is the radius of base_footprint, which sits midway between
      # the axles, so the physical floor is sqrt(0.45^2 + 0.145^2) = 0.47 m.
      # The outer front corner sweeps about 0.65 m (51 in diameter) at full
      # lock, which matters for the footprint and inflation, not for this value.
      # 0.80 keeps a margin above the 0.47 m floor and the Path follower tracks
      # gentle arcs far better. Lowering it is a tuning decision for the Path
      # follower ticket.
      minimum_turning_radius: 0.80
      tolerance: 0.20
      allow_unknown: true
      downsample_costmap: false
      max_iterations: 1000000
      max_on_lane_iterations: 2500
      max_planning_time: 2.0
      analytic_expansion_ratio: 3.5
      reverse_penalty: 500.0            # Discourage reversing
      change_penalty: 5.0             # Discourage changing directions

      non_straight_penalty: 1.05
      cost_penalty: 1.0
      retravel_cost: 1.0

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    use_stamped_vel: false
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.26, 0.0, 1.0]
    min_velocity: [-0.26, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: /visual_slam/tracking/odometry   # only read in CLOSED_LOOP feedback
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    # Zero the output this long after the controller server's last command,
    # so a dead controller server stops the car inside a second even though
    # this node keeps publishing (see config/velocity_mux.yaml).
    velocity_timeout: 0.5
 
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: False
    autostart: True
    node_names: ['controller_server', 'planner_server', 'behavior_server', 'bt_navigator', 'waypoint_follower', 'smoother_server', 'velocity_smoother']
    bond_timeout: 4.0
