controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    bicycle_steering_controller:
      type: bicycle_steering_controller/BicycleSteeringController

# Individual controller configurations
joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

# Bicycle steering controller configuration
bicycle_steering_controller:
  ros__parameters:
    # HUMBLE SPECIFIC - Use these parameter names
    rear_wheels_names: ["traction_joint"]
    front_wheels_names: ["steering_joint"]
    front_steering: true
    
    # Interface types
    traction_interface_name: velocity
    steering_interface_name: position
    
    # Physical parameters (all required > 0.0)
    wheelbase: 0.29
    front_wheel_radius: 0.0508  # from description/description.urdf.xacro wheel_radius; keep the two identical
    rear_wheel_radius: 0.0508   # same wheels front and rear

    # Optional control parameters
    update_rate: 50
    reference_timeout: 1.0
    
    # Odometry configuration. open_loop: the hardware has no encoders; its
    # state interfaces echo the command (see pca9685_system.cpp read()), so
    # integrate the command rather than pretend the echo is a measurement.
    # Pose for Nav2 comes from visual SLAM either way (enable_odom_tf false).
    open_loop: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    enable_odom_tf: false
    
    subscribe_to_joint_state: false
    # Read TwistStamped on ~/reference (the velocity mux stamps its output).
    # The unstamped input logs a deprecation warning on every message, and the
    # mux publishes at 20 Hz whenever nothing else is fresh.
    use_stamped_vel: true
